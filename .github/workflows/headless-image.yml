name: headless-image

# Builds the headless gateway binary on GitHub's runners and packages it as a
# `docker save` tarball, so the target host never has to compile anything:
#
#   docker load -i autojev-headless-image.tar.gz
#
# The desktop (Tauri) build in release.yml is untouched — this job skips the frontend
# entirely and compiles the crate directly, so no pnpm/node and no signing key needed.
on:
  workflow_dispatch:
  push:
    branches: [headless]

permissions:
  contents: read

env:
  IMAGE_TAG: autojev-headless

jobs:
  image:
    # Pinned to 22.04 so the produced glibc matches the ubuntu:22.04 runtime image.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev file

      - name: Build release binary
        run: |
          # generate_context! embeds the frontendDist directory at compile time, so it must
          # exist. Headless never serves it — a placeholder avoids building the React app.
          mkdir -p dist
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml

      - name: Assemble image context
        run: |
          strip src-tauri/target/release/autojev || true
          mkdir -p .image
          cp src-tauri/target/release/autojev .image/autojev

      - name: Build runtime image
        run: docker build -f docker/Dockerfile.headless -t "$IMAGE_TAG:${{ github.sha }}" .image

      # Upstream's .deb Depends: line is generated from ldd by tauri, which makes it the
      # authority on what the binary needs. Diffing against it catches a runtime library
      # added upstream that our Dockerfile would otherwise be missing on the next release.
      - name: Check runtime deps against upstream .deb
        run: |
          set -eu
          ver=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          url="https://github.com/thinkany-ai/autojev/releases/download/v${ver}/AutoJev_${ver}_amd64.deb"
          if ! curl -fsL -o upstream.deb "$url"; then
            echo "::warning::no upstream .deb for v${ver}; skipping the dependency check"
            exit 0
          fi
          depends=$(ar p upstream.deb control.tar.gz | tar xzO ./control \
            | sed -n 's/^Depends: *//p' | tr -d ' ' | tr ',' '\n' \
            | sed 's/(.*)//' | grep -v '^$' | sort -u)
          have=$(docker run --rm --entrypoint dpkg "$IMAGE_TAG:${{ github.sha }}" -l 2>/dev/null \
            | awk '/^ii/{print $2}' | sed 's/:amd64$//' | sort -u)
          missing=$(comm -23 <(printf '%s\n' "$depends") <(printf '%s\n' "$have") || true)
          echo "upstream Depends: $(echo $depends)"
          if [ -n "$missing" ]; then
            echo "::error::runtime image is missing: $(echo $missing) — add them to docker/Dockerfile.headless"
            exit 1
          fi
          echo "runtime libraries satisfy upstream v${ver}"

      # Boot the thing. A missing runtime library or a Tauri assumption that only holds
      # inside a GUI process shows up here, not on the target host. Any non-200 fails the job.
      - name: Smoke test the gateway
        run: |
          set -e
          docker run -d --name smoke -p 9527:9527 "$IMAGE_TAG:${{ github.sha }}"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9527/health >/dev/null 2>&1 && break
            sleep 1
          done
          echo "--- /health ---"
          curl -fsS --max-time 10 http://127.0.0.1:9527/health
          echo
          echo "--- /v1/models ---"
          curl -fsS --max-time 10 http://127.0.0.1:9527/v1/models
          echo
          echo "--- container log ---"
          docker logs smoke 2>&1 | tail -20
          docker rm -f smoke >/dev/null

      - name: Save image for offline load
        run: |
          docker save "$IMAGE_TAG:${{ github.sha }}" | gzip -9 > autojev-headless-image.tar.gz
          ls -lh autojev-headless-image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: autojev-headless-image
          path: autojev-headless-image.tar.gz
          retention-days: 14
